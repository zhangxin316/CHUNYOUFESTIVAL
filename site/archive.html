<style>

/* =========================
   ARCHIVE
========================= */

.archive {

    min-height: 100vh;

    padding:
        80px
        40px
        80px;

}


.archive h1 {

    text-align: center;

    font-size: 20px;

    font-weight: 400;

    letter-spacing: 2px;

    margin-bottom: 60px;

}


/* =========================
   YEARS
========================= */

.years {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 18px;

}


.year-item {

    position: relative;

}


.year-item > a {

    display: block;

    font-size: 16px;

    font-weight: 400;

    line-height: 1.4;

    color: #fff;

    text-decoration: none;

    transition: opacity 0.2s ease;

}


.year-item > a:hover {

    opacity: 0.45;

}



/* =========================
   POSTERS
========================= */

.year-poster {

    position: fixed;

    top: 50%;

    right: 7vw;

    transform:
        translateY(-50%);

    width: 300px;

    max-height: 72vh;

    object-fit: contain;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    z-index: 20;

    transition:
        opacity 0.25s ease;

}


.year-item:hover .year-poster {

    opacity: 1;

    visibility: visible;

}



/* =========================
   MENU ICON
========================= */

.site-menu > #menu-button {

    width: 30px;

    height: 22px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0;

    font-size: 0;

    letter-spacing: 0;

}


.menu-icon {

    position: relative;

    display: block;

    width: 28px;

    height: 1px;

    background: #fff;

    transition:
        background 0.25s ease;

}


.menu-icon::before,
.menu-icon::after {

    content: "";

    position: absolute;

    left: 0;

    width: 28px;

    height: 1px;

    background: #fff;

    transition:
        transform 0.3s ease,
        top 0.3s ease,
        opacity 0.3s ease;

}


.menu-icon::before {

    top: -8px;

}


.menu-icon::after {

    top: 8px;

}


/* MENU OPEN → X */

.site-menu.open .menu-icon {

    background: transparent;

}


.site-menu.open .menu-icon::before {

    top: 0;

    transform: rotate(45deg);

}


.site-menu.open .menu-icon::after {

    top: 0;

    transform: rotate(-45deg);

}


/* Hover */

.site-menu > #menu-button:hover .menu-icon,
.site-menu > #menu-button:hover .menu-icon::before,
.site-menu > #menu-button:hover .menu-icon::after {

    background: #888;

}


.site-menu.open > #menu-button:hover .menu-icon {

    background: transparent;

}



/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .archive {

        padding:
            80px
            20px
            60px;

    }


    .archive h1 {

        font-size: 18px;

        margin-bottom: 50px;

    }


    .years {

        gap: 17px;

    }


    .year-item > a {

        font-size: 16px;

    }


    .year-poster {

        display: none;

    }


    /* hamburger position */

    .site-menu > #menu-button {

        position: fixed;

        top: 30px;

        right: 24px;

        width: 30px;

        height: 22px;

        z-index: 10001;

    }

}

</style>

<script>

const siteMenu =
    document.getElementById("site-menu");

const menuButton =
    document.getElementById("menu-button");

const menuList =
    document.querySelector(".menu-list");


menuButton.onclick = function(e) {

    e.preventDefault();


    const isOpen =
        menuList.style.display === "flex";


    if (isOpen) {

        menuList.style.display = "none";

        siteMenu.classList.remove("open");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );


    } else {

        menuList.style.display = "flex";

        siteMenu.classList.add("open");

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }

};

</script>
