  >

  <meta
    name="keywords"
    content="春游音乐节, 春游, CHUNYOU FESTIVAL, CHUNYOU, 成都音乐节, Chengdu Music Festival"
  >

    rel="canonical"
    href="https://www.chunyoufestival.com/"
  >


  <!-- =========================
       STRUCTURED DATA
  ========================= -->

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://www.chunyoufestival.com/#organization",
        "name": "CHUNYOU FESTIVAL",
        "alternateName": [
          "春游音乐节",
          "CHUNYOU"
        ],
        "url": "https://www.chunyoufestival.com/",
        "logo": "https://www.chunyoufestival.com/logo.png",
        "foundingDate": "2013",
        "sameAs": [
          "https://www.instagram.com/chunyoufestival/"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://www.chunyoufestival.com/#website",
        "url": "https://www.chunyoufestival.com/",
        "name": "CHUNYOU FESTIVAL 春游音乐节",
        "alternateName": "春游音乐节",
        "publisher": {
          "@id": "https://www.chunyoufestival.com/#organization"
        },
        "inLanguage": [
          "zh-CN",
          "en"
        ]
      }
    ]
  }
  </script>


  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">


  <style>

    /* =========================
       ENTRY SCREEN
    ========================= */

    .entry-screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100vh;
      height: 100svh;

      background: #000;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 9999;

      cursor: pointer;

      opacity: 1;
      transition: opacity 0.8s ease;
    }


    .entry-screen.hide {
      opacity: 0;
      pointer-events: none;
    }


    .entry-text {
      margin: 0;

      font-family: "Inter", Arial, sans-serif;

      font-size: clamp(28px, 4vw, 64px);
      font-weight: 400;

      letter-spacing: -0.02em;
      line-height: 1;

      color: #fff;

      text-align: center;
    }


    @media (max-width: 800px) {

      .entry-text {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       ORIGINAL HOMEPAGE
  ========================= -->

  <main class="hero">

    <img
      src="logo.png"
      alt="CHUNYOU FESTIVAL 春游音乐节"
      class="logo"
    >

    <h1>CHUNYOU FESTIVAL</h1>

    <p class="since">EST. 2013</p>


    <nav class="menu">

      <a href="archive.html">
        Archive
      </a>

      <a href="festival.html">
        Festival
      </a>

      <a href="news.html">
        News
      </a>

      <a href="family.html">
        Family
      </a>

      <a href="contact.html">
        Contact
      </a>

    </nav>

  </main>



  <!-- =========================
       ENTRY SCREEN
  ========================= -->

  <div
    class="entry-screen"
    id="entry-screen"
    role="button"
    tabindex="0"
    aria-label="Enter CHUNYOU FESTIVAL"
  >

    <p class="entry-text">
      WE MEET IN SPRING.
    </p>

  </div>



  <!-- =========================
       ENTRY INTERACTION
  ========================= -->

  <script>

    const entryScreen =
      document.getElementById("entry-screen");


    function enterSite() {

      entryScreen.classList.add("hide");


      setTimeout(() => {

        entryScreen.remove();

      }, 800);

    }


    entryScreen.addEventListener(
      "click",
      enterSite
    );


    entryScreen.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          enterSite();

        }

      }
    );

  </script>


</body>

</html>
