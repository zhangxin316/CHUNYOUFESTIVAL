<style>

/* =========================
   FAMILY PAGE
========================= */

.family-page{

    min-height:100vh;
    min-height:100svh;

    padding:
        120px
        50px
        140px;

}


.family-title{

    text-align:center;

    font-size:20px;

    font-weight:400;

    line-height:1.3;

    letter-spacing:3px;

    margin-bottom:100px;

}



/* =========================
   FAMILY GRID
========================= */

.family-grid{

    width:100%;

    max-width:1180px;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        repeat(4, 1fr);

    column-gap:70px;

    row-gap:90px;

}



/* =========================
   FAMILY ITEM
========================= */

.family-item{

    position:relative;

    min-width:0;

    text-align:center;

}


.family-visual{

    width:100%;

    height:130px;

    display:flex;

    align-items:center;

    justify-content:center;

}


.family-visual img{

    display:block;

    width:auto;

    height:auto;

    max-width:180px;

    max-height:90px;

    object-fit:contain;

    transition:
        opacity 0.35s ease,
        transform 0.35s ease;

}



/* =========================
   FAMILY NAME
========================= */

.family-name{

    margin-top:20px;

    color:#777;

    font-size:12px;

    font-weight:400;

    line-height:1.5;

    letter-spacing:1px;

    opacity:0;

    transform:translateY(4px);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;

}


.family-item:hover .family-name{

    opacity:1;

    transform:translateY(0);

}


.family-item:hover .family-visual img{

    opacity:0.72;

    transform:scale(0.98);

}



/* =========================
   WIDE LOGOS
========================= */

.family-item.wide .family-visual img{

    max-width:210px;

    max-height:80px;

}



/* =========================
   SMALL / SQUARE LOGOS
========================= */

.family-item.square .family-visual img{

    max-width:105px;

    max-height:105px;

}



/* =========================
   PHOTO ITEMS
========================= */

.family-item.photo .family-visual{

    height:180px;

}


.family-item.photo .family-visual img{

    width:135px;

    height:180px;

    max-width:none;

    max-height:none;

    object-fit:cover;

}



/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .family-page{

        padding:
            100px
            22px
            90px;

    }


    .family-title{

        font-size:18px;

        letter-spacing:2.5px;

        margin-bottom:70px;

    }


    .family-grid{

        grid-template-columns:
            repeat(2, 1fr);

        column-gap:28px;

        row-gap:58px;

    }


    .family-visual{

        height:100px;

    }


    .family-visual img{

        max-width:125px;

        max-height:70px;

    }


    .family-item.wide .family-visual img{

        max-width:140px;

        max-height:65px;

    }


    .family-item.square .family-visual img{

        max-width:80px;

        max-height:80px;

    }


    .family-name{

        margin-top:14px;

        font-size:11px;

        line-height:1.45;

        letter-spacing:0.5px;

        opacity:1;

        transform:none;

    }


    .family-item.photo .family-visual{

        height:150px;

    }


    .family-item.photo .family-visual img{

        width:112px;

        height:150px;

    }


    .family-item:hover .family-visual img{

        opacity:1;

        transform:none;

    }

}

<script>

/* =========================
   SITE MENU
========================= */

const siteMenu =
    document.getElementById("site-menu");

const menuButton =
    document.getElementById("menu-button");

const menuList =
    document.querySelector(".menu-list");


menuButton.onclick = function(e){

    e.preventDefault();

    const isOpen =
        menuList.style.display === "flex";


    if(isOpen){

        menuList.style.display =
            "none";

        siteMenu.classList.remove(
            "open"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }else{

        menuList.style.display =
            "flex";

        siteMenu.classList.add(
            "open"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }

};

</script>
