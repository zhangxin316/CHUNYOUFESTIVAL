<!DOCTYPE html>

<title>CHUNYOU ARCHIVE 2014</title>

<link rel="stylesheet" href="style.css">

<style>

.gallery-page{
    max-width:1200px;
    margin:0 auto;
    padding:60px 30px;
}

.gallery-header{
    margin-bottom:60px;
}

.gallery-header a{
    text-decoration:none;
    color:inherit;
}

.gallery-title{
    text-align:center;
    margin-bottom:60px;
}

.gallery-title h1{
    font-size:32px;
    font-weight:500;
    letter-spacing:4px;
    margin:0;
}

.gallery{
    column-count:3;
    column-gap:20px;
}

.gallery-item{
    break-inside:avoid;
    margin-bottom:20px;
}

.gallery-item img{
    display:block;
    width:100%;
    height:auto;
}

@media(max-width:800px){

    .gallery-page{
        padding:30px 20px;
    }

    .gallery-header{
        margin-bottom:50px;
    }

    .gallery-title{
        margin-bottom:40px;
    }

    .gallery-title h1{
        font-size:28px;
        letter-spacing:3px;
    }

    .gallery{
        column-count:2;
        column-gap:12px;
    }

    .gallery-item{
        margin-bottom:12px;
    }

}

@media(max-width:500px){

    .gallery{
        column-count:1;
    }

}

</style>

</head>
