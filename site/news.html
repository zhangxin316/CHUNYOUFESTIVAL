<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>News | CHUNYOU FESTIVAL</title>

  <meta
    name="description"
    content="News from CHUNYOU FESTIVAL."
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">


  <style>

    /* =========================
       NEWS PAGE
    ========================= */

    .news-page {

      min-height: 100vh;
      min-height: 100svh;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 40px;

      box-sizing: border-box;

    }


    .news-message {

      margin: 0;

      font-family: "Inter", Arial, sans-serif;

      font-size: clamp(28px, 4vw, 64px);

      font-weight: 400;

      letter-spacing: -0.02em;

      text-align: center;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .news-page {

        padding: 30px 20px;

      }


      .news-message {

        font-size: 28px;

      }

    }

  </style>

</head>



<body>


  <nav class="site-menu">

    <a href="#" id="menu-button">
      MENU
    </a>


    <div class="menu-list">

      <a href="archive.html">
        Archive
      </a>

      <a href="festival.html">
        Festival
      </a>

      <a href="news.html">
        News
      </a>

      <a href="family.html">
        Family
      </a>

      <a href="contact.html">
        Contact
      </a>

    </div>

  </nav>



  <main class="news-page">

    <p class="news-message">
      Until next spring.
    </p>

  </main>



  <script>

    const menuButton =
      document.getElementById("menu-button");

    const menuList =
      document.querySelector(".menu-list");


    menuButton.onclick = function(e) {

      e.preventDefault();


      if (menuList.style.display === "flex") {

        menuList.style.display = "none";

      } else {

        menuList.style.display = "flex";

      }

    };

  </script>


</body>

</html>
