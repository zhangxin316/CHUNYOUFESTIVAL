<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CHUNYOU NEWS</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">


<style>

/* =========================
   NEWS
========================= */

.news-page{

    min-height:100vh;
    min-height:100svh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:40px 20px;

}


.news-text{

    font-family:
        "Inter",
        Arial,
        sans-serif;

    font-size:
        clamp(28px, 4vw, 64px);

    font-weight:400;

    line-height:1.2;

    letter-spacing:-0.02em;

    text-align:center;

}


@media(max-width:800px){

    .news-text{

        font-size:28px;

    }

}

</style>

</head>



<body>


<!-- =========================
     SITE MENU
========================= -->

<nav
    class="site-menu"
    id="site-menu"
>

    <a
        href="#"
        id="menu-button"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <span class="menu-icon"></span>

    </a>


    <div class="menu-list">

        <a href="archive.html">
            Archive
        </a>

        <a href="festival.html">
            Festival
        </a>

        <a href="news.html">
            News
        </a>

        <a href="family.html">
            Family
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</nav>



<!-- =========================
     NEWS
========================= -->

<main class="news-page">

    <div class="news-text">

        Until next spring.

    </div>

</main>



<script>

/* =========================
   SITE MENU
========================= */

const siteMenu =
    document.getElementById("site-menu");

const menuButton =
    document.getElementById("menu-button");

const menuList =
    document.querySelector(".menu-list");


menuButton.onclick = function(e){

    e.preventDefault();


    const isOpen =
        menuList.style.display === "flex";


    if(isOpen){

        menuList.style.display =
            "none";

        siteMenu.classList.remove(
            "open"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );


    }else{

        menuList.style.display =
            "flex";

        siteMenu.classList.add(
            "open"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }

};

</script>


</body>

</html>
