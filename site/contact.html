<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>CONTACT — CHUNYOU FESTIVAL</title>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="style.css">


<style>

/* =========================
   CONTACT
========================= */

.contact-page{

    min-height:100vh;
    min-height:100svh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:80px 40px;

}


.contact-content{

    width:100%;

    max-width:620px;

    text-align:center;

}


.contact-content h1{

    font-size:20px;

    font-weight:400;

    line-height:1.3;

    letter-spacing:3px;

    margin-bottom:50px;

}


.contact-email{

    display:inline-block;

    color:#fff;

    text-decoration:none;

    font-size:18px;

    font-weight:400;

    line-height:1.5;

    margin-bottom:24px;

    transition:opacity 0.25s ease;

}


.contact-email:hover{

    opacity:0.5;

}


.contact-description{

    color:#888;

    font-size:14px;

    line-height:1.7;

    margin-bottom:55px;

}


.contact-social-title{

    color:#666;

    font-size:12px;

    letter-spacing:2px;

    margin-bottom:20px;

}


.contact-social{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;

}


.contact-social a{

    color:#fff;

    text-decoration:none;

    font-size:16px;

    line-height:1.4;

    transition:opacity 0.25s ease;

}


.contact-social a:hover{

    opacity:0.5;

}



/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .contact-page{

        padding:100px 20px 70px;

    }


    .contact-content h1{

        font-size:18px;

        margin-bottom:44px;

    }


    .contact-email{

        font-size:16px;

    }


    .contact-description{

        font-size:13px;

        margin-bottom:48px;

    }


    .contact-social a{

        font-size:16px;

    }

}

</style>

</head>


<body>


<!-- =========================
     SITE MENU
========================= -->

<nav
    class="site-menu"
    id="site-menu"
>

    <a
        href="#"
        id="menu-button"
        aria-label="Open menu"
        aria-expanded="false"
    >

        <span class="menu-icon"></span>

    </a>


    <div class="menu-list">

        <a href="archive.html">
            Archive
        </a>

        <a href="festival.html">
            Festival
        </a>

        <a href="news.html">
            News
        </a>

        <a href="family.html">
            Family
        </a>

        <a href="contact.html">
            Contact
        </a>

    </div>

</nav>



<!-- =========================
     CONTACT
========================= -->

<main class="contact-page">

    <div class="contact-content">


        <h1>
            CONTACT
        </h1>


        <a
            class="contact-email"
            href="mailto:Morningchengdumusic@gmail.com"
        >
            Morningchengdumusic@gmail.com
        </a>


        <p class="contact-description">
            For collaborations, artists, media and everything else.
        </p>


        <div class="contact-social-title">
            INSTAGRAM
        </div>


        <div class="contact-social">

            <a
                href="https://www.instagram.com/chunyoufestival/"
                target="_blank"
                rel="noopener noreferrer"
            >
                @chunyoufestival
            </a>


            <a
                href="https://www.instagram.com/morningchengdu/"
                target="_blank"
                rel="noopener noreferrer"
            >
                @morningchengdu
            </a>

        </div>


    </div>

</main>



<script>

/* =========================
   SITE MENU
========================= */

const siteMenu =
    document.getElementById("site-menu");

const menuButton =
    document.getElementById("menu-button");

const menuList =
    document.querySelector(".menu-list");


menuButton.onclick = function(e){

    e.preventDefault();


    const isOpen =
        menuList.style.display === "flex";


    if(isOpen){

        menuList.style.display =
            "none";

        siteMenu.classList.remove(
            "open"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );


    }else{

        menuList.style.display =
            "flex";

        siteMenu.classList.add(
            "open"
        );

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }

};

</script>


</body>

</html>
