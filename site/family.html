<style>

/* =========================
   FAMILY PAGE
========================= */

.family-page {
    min-height: 100vh;
    min-height: 100svh;
    padding: 120px 50px 150px;
}

.family-title {
    text-align: center;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: 3px;
    margin-bottom: 100px;
}


/* =========================
   FAMILY GRID
========================= */

.family-grid {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    column-gap: 65px;
    row-gap: 80px;
}


/* =========================
   FAMILY ITEM
========================= */

.family-item {
    position: relative;
    min-width: 0;
    text-align: center;
}

.family-visual {
    width: 100%;
    height: 150px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================
   DEFAULT LOGOS

   Most transparent PNG logos
   are black artwork.
   Turn them white on black.
========================= */

.family-item:not(.photo):not(.original) .family-visual img {
    display: block;

    width: auto;
    height: auto;

    max-width: 190px;
    max-height: 100px;

    object-fit: contain;

    filter: brightness(0) invert(1);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =========================
   WIDE LOGOS
========================= */

.family-item.wide:not(.photo):not(.original) .family-visual img {
    max-width: 220px;
    max-height: 90px;
}


/* =========================
   SQUARE LOGOS
========================= */

.family-item.square:not(.photo):not(.original) .family-visual img {
    max-width: 115px;
    max-height: 115px;
}


/* =========================
   ORIGINAL IMAGE

   Images that should NOT
   receive white-logo filter.
========================= */

.family-item.original .family-visual img {
    display: block;

    width: auto;
    height: auto;

    max-width: 130px;
    max-height: 120px;

    object-fit: contain;

    filter: none;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =========================
   PHOTOS
========================= */

.family-item.photo .family-visual {
    height: 210px;
}

.family-item.photo .family-visual img {
    display: block;

    width: 150px;
    height: 200px;

    max-width: none;
    max-height: none;

    object-fit: cover;

    filter: none;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =========================
   FAMILY NAME
========================= */

.family-name {
    margin-top: 15px;

    color: #777;

    font-size: 12px;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 1px;

    opacity: 0;
    transform: translateY(4px);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

.family-item:hover .family-name {
    opacity: 1;
    transform: translateY(0);
}

.family-item:hover .family-visual img {
    opacity: 0.6;
    transform: scale(0.97);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .family-page {
        padding: 100px 22px 90px;
    }

    .family-title {
        font-size: 18px;
        letter-spacing: 2.5px;
        margin-bottom: 70px;
    }

    .family-grid {
        grid-template-columns: repeat(2, 1fr);
        column-gap: 28px;
        row-gap: 55px;
    }

    .family-visual {
        height: 115px;
    }

    .family-item:not(.photo):not(.original) .family-visual img {
        max-width: 130px;
        max-height: 78px;
    }

    .family-item.wide:not(.photo):not(.original) .family-visual img {
        max-width: 145px;
        max-height: 72px;
    }

    .family-item.square:not(.photo):not(.original) .family-visual img {
        max-width: 88px;
        max-height: 88px;
    }

    .family-item.original .family-visual img {
        max-width: 95px;
        max-height: 95px;
    }

    .family-item.photo .family-visual {
        height: 165px;
    }

    .family-item.photo .family-visual img {
        width: 115px;
        height: 155px;
    }

    .family-name {
        margin-top: 12px;

        font-size: 11px;
        line-height: 1.45;
        letter-spacing: 0.5px;

        opacity: 1;
        transform: none;
    }

    .family-item:hover .family-visual img {
        opacity: 1;
        transform: none;
    }

}

</style>

<script>

/* =========================
   SITE MENU
========================= */

const siteMenu =
    document.getElementById("site-menu");

const menuButton =
    document.getElementById("menu-button");

const menuList =
    document.querySelector(".menu-list");


menuButton.onclick = function(e) {

    e.preventDefault();

    const isOpen =
        menuList.style.display === "flex";

    if (isOpen) {

        menuList.style.display = "none";

        siteMenu.classList.remove("open");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    } else {

        menuList.style.display = "flex";

        siteMenu.classList.add("open");

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }

};

</script>
