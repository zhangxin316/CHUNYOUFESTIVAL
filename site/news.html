<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>News | CHUNYOU FESTIVAL</title>

<meta
  name="description"
  content="News from CHUNYOU FESTIVAL."
>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="style.css">


<style>

/* =========================
   NEWS PAGE
========================= */

.news-page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 40px;

  box-sizing: border-box;

}


.news-inner {

  text-align: center;

}


.news-title {

  margin: 0 0 34px;

  font-size: 30px;

  font-weight: 500;

  letter-spacing: 1px;

}


.news-message {

  margin: 0;

  font-size: 16px;

  font-weight: 400;

  letter-spacing: 0.5px;

  opacity: 0.78;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

  .news-page {

    padding: 30px 22px;

  }


  .news-title {

    margin-bottom: 28px;

    font-size: 26px;

  }


  .news-message {

    font-size: 15px;

  }

}

</style>

</head>


<body>


<nav class="site-menu">

  <a href="#" id="menu-button">
    MENU
  </a>


  <div class="menu-list">

    <a href="archive.html">
      Archive
    </a>

    <a href="festival.html">
      Festival
    </a>

    <a href="news.html">
      News
    </a>

    <a href="family.html">
      Family
    </a>

    <a href="contact.html">
      Contact
    </a>

  </div>

</nav>



<main class="news-page">

  <div class="news-inner">

    <h1 class="news-title">
      NEWS
    </h1>

    <p class="news-message">
      Until next spring.
    </p>

  </div>

</main>



<script>

/* =========================
   MENU
========================= */

const menuButton =
  document.getElementById("menu-button");

const menuList =
  document.querySelector(".menu-list");


menuButton.onclick = function(e) {

  e.preventDefault();


  if (
    menuList.style.display === "flex"
  ) {

    menuList.style.display = "none";

  } else {

    menuList.style.display = "flex";

  }

};

</script>


</body>

</html>
