}

   Masonry Gallery
   ========================= */

.gallery{

}


.gallery-item{

    break-inside:avoid;

}


.gallery-item img{

    height:auto;

}

   ========================= */

    }


    .gallery{

    }


    .gallery-item{

    }

}
