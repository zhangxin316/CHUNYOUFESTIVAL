<style>

/* =========================
   FAMILY PAGE
========================= */

.family-page {
    min-height: 100vh;
    min-height: 100svh;
    padding: 110px 50px 110px;
}

.family-title {
    text-align: center;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: 3px;
    margin-bottom: 60px;
}


/* =========================
   FAMILY GRID
========================= */

.family-grid {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    column-gap: 38px;
    row-gap: 30px;
}


/* =========================
   FAMILY ITEM
========================= */

.family-item {
    position: relative;
    min-width: 0;
    text-align: center;
}

.family-visual {
    width: 100%;
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================
   DEFAULT LOGOS
   BLACK → WHITE
========================= */

.family-item:not(.photo):not(.original) .family-visual img {
    display: block;

    width: auto;
    height: auto;

    max-width: 185px;
    max-height: 88px;

    object-fit: contain;

    filter: brightness(0) invert(1);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =========================
   WIDE LOGOS
========================= */

.family-item.wide:not(.photo):not(.original) .family-visual img {
    max-width: 210px;
    max-height: 82px;
}


/* =========================
   SQUARE LOGOS
========================= */

.family-item.square:not(.photo):not(.original) .family-visual img {
    max-width: 105px;
    max-height: 105px;
}


/* =========================
   ORIGINAL IMAGE
========================= */

.family-item.original .family-visual img {
    display: block;

    width: auto;
    height: auto;

    max-width: 120px;
    max-height: 105px;

    object-fit: contain;

    filter: none;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =========================
   PHOTOS
========================= */

.family-item.photo .family-visual {
    height: 160px;
}

.family-item.photo .family-visual img {
    display: block;

    width: 120px;
    height: 150px;

    max-width: none;
    max-height: none;

    object-fit: cover;

    filter: none;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


/* =========================
   BLACK & WHITE PHOTOS
========================= */

.family-item.photo.bw .family-visual img {
    filter: grayscale(100%);
}


/* =========================
   FAMILY NAME
========================= */

.family-name {
    margin-top: 10px;

    color: #777;

    font-size: 12px;
    font-weight: 400;
    line-height: 1.5;
    letter-spacing: 1px;

    opacity: 0;
    transform: translateY(4px);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

.family-item:hover .family-name {
    opacity: 1;
    transform: translateY(0);
}

.family-item:hover .family-visual img {
    opacity: 0.65;
    transform: scale(0.97);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .family-page {
        padding: 95px 20px 80px;
    }

    .family-title {
        font-size: 18px;
        letter-spacing: 2.5px;
        margin-bottom: 50px;
    }

    .family-grid {
        grid-template-columns: repeat(2, 1fr);

        column-gap: 22px;
        row-gap: 26px;
    }

    .family-visual {
        height: 95px;
    }

    .family-item:not(.photo):not(.original) .family-visual img {
        max-width: 125px;
        max-height: 68px;
    }

    .family-item.wide:not(.photo):not(.original) .family-visual img {
        max-width: 140px;
        max-height: 65px;
    }

    .family-item.square:not(.photo):not(.original) .family-visual img {
        max-width: 78px;
        max-height: 78px;
    }

    .family-item.original .family-visual img {
        max-width: 90px;
        max-height: 82px;
    }

    .family-item.photo .family-visual {
        height: 140px;
    }

    .family-item.photo .family-visual img {
        width: 105px;
        height: 135px;
    }

    .family-name {
        margin-top: 8px;

        font-size: 11px;
        line-height: 1.4;
        letter-spacing: 0.5px;

        opacity: 1;
        transform: none;
    }

    .family-item:hover .family-visual img {
        opacity: 1;
        transform: none;
    }

}

</style>

<script>

const siteMenu =
    document.getElementById("site-menu");

const menuButton =
    document.getElementById("menu-button");

const menuList =
    document.querySelector(".menu-list");


menuButton.onclick = function(e) {

    e.preventDefault();

    const isOpen =
        menuList.style.display === "flex";

    if (isOpen) {

        menuList.style.display = "none";

        siteMenu.classList.remove("open");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    } else {

        menuList.style.display = "flex";

        siteMenu.classList.add("open");

        menuButton.setAttribute(
            "aria-expanded",
            "true"
        );

    }

};

</script>
