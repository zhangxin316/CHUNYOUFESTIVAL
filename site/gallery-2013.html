/* =========================

   ========================= */

.gallery-page{

}


/* Header */

.gallery-header{
    margin-bottom:70px;
}

.gallery-header a{

}


/* Title */

.gallery-title{

    margin-bottom:70px;
}

.gallery-title h1{

    font-weight:500;
    letter-spacing:6px;
}


/* Gallery */

.gallery{
    max-width:1200px;
    margin:0 auto;

    columns:3 300px;
    column-gap:20px;
}


/* Images */

.gallery img{
    width:100%;
    height:auto;

    display:block;

    margin-bottom:20px;

    break-inside:avoid;
}


/* =========================
   Mobile
   ========================= */

@media(max-width:800px){

    .gallery-page{
        padding:30px 20px 60px;
    }


    .gallery-header{
        margin-bottom:50px;
    }


    .gallery-title{
        margin-bottom:45px;
    }


    .gallery-title h1{
        font-size:28px;
        letter-spacing:4px;
    }


    .gallery{
        columns:1;
        column-gap:0;
    }


    .gallery img{
        margin-bottom:15px;
    }

}
