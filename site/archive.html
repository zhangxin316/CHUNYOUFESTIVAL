<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CHUNYOU ARCHIVE</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {
      min-height: 100%;
      background: #000;
    }


    body {
      color: #fff;

      font-family:
        "Inter",
        "Noto Sans SC",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }



    /* =========================
       MENU
    ========================= */

    .site-menu {

      position: fixed;

      top: 38px;
      right: 48px;

      z-index: 1000;

      display: flex;

      flex-direction: column;

      align-items: flex-end;

    }


    #menu-button {

      font-size: 13px;

      letter-spacing: 0.08em;

      cursor: pointer;

    }


    .menu-list {

      display: none;

      flex-direction: column;

      align-items: flex-end;

      gap: 9px;

      margin-top: 16px;

    }


    .menu-list a {

      font-size: 14px;

      transition: opacity 0.2s ease;

    }


    .menu-list a:hover {

      opacity: 0.5;

    }



    /* =========================
       ARCHIVE
    ========================= */

    .archive-page {

      min-height: 100vh;

      padding:
        42px
        50px
        70px
        50px;

    }


    .archive-title {

      font-size: 13px;

      font-weight: 400;

      letter-spacing: 0.08em;

      margin-bottom: 85px;

    }



    .archive-layout {

      display: grid;

      grid-template-columns:
        minmax(300px, 1fr)
        minmax(300px, 500px);

      gap: 80px;

      align-items: start;

      max-width: 1450px;

    }



    /* YEARS */

    .years {

      display: flex;

      flex-direction: column;

    }


    .year-link {

      position: relative;

      display: flex;

      align-items: center;

      justify-content: space-between;

      min-height: 72px;

      border-top:
        1px solid
        rgba(255,255,255,0.28);

      transition:
        opacity 0.2s ease;

    }


    .year-link:last-child {

      border-bottom:
        1px solid
        rgba(255,255,255,0.28);

    }


    .year-link:hover {

      opacity: 0.55;

    }


    .year-number {

      font-size:
        clamp(
          34px,
          4.2vw,
          64px
        );

      font-weight: 400;

      line-height: 1;

      letter-spacing: -0.04em;

    }


    .year-arrow {

      font-size: 18px;

      opacity: 0;

      transform:
        translateX(-8px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;

    }


    .year-link:hover
    .year-arrow {

      opacity: 1;

      transform:
        translateX(0);

    }



    /* =========================
       POSTER PREVIEW
    ========================= */

    .poster-preview {

      position: sticky;

      top: 80px;

      width: 100%;

      height:
        calc(100vh - 140px);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .poster-preview img {

      max-width: 100%;

      max-height: 100%;

      width: auto;

      height: auto;

      display: block;

      opacity: 0;

      transform:
        scale(0.985);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;

    }


    .poster-preview img.visible {

      opacity: 1;

      transform:
        scale(1);

    }



    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {


      .site-menu {

        top: 27px;
        right: 20px;

      }


      .archive-page {

        padding:
          28px
          20px
          50px
          20px;

      }


      .archive-title {

        margin-bottom: 70px;

        font-size: 12px;

      }


      .archive-layout {

        display: block;

      }


      .poster-preview {

        display: none;

      }


      .year-link {

        min-height: 66px;

      }


      .year-number {

        font-size: 38px;

      }


      .year-arrow {

        opacity: 1;

        transform: none;

        font-size: 16px;

      }

    }


  </style>

</head>

  <script>


    /* MENU */

    const menuButton =
      document.getElementById(
        "menu-button"
      );

    const menuList =
      document.querySelector(
        ".menu-list"
      );


    menuButton.onclick =
      function(e) {

        e.preventDefault();


        if (
          menuList.style.display
          ===
          "flex"
        ) {

          menuList.style.display
            =
            "none";

        } else {

          menuList.style.display
            =
            "flex";

        }

      };



    /* POSTER HOVER */

    const yearLinks =
      document.querySelectorAll(
        ".year-link"
      );

    const posterImage =
      document.getElementById(
        "posterImage"
      );


    yearLinks.forEach(

      function(link) {


        link.addEventListener(

          "mouseenter",

          function() {


            if (
              window.innerWidth
              <=
              800
            ) {

              return;

            }


            const poster =
              link.getAttribute(
                "data-poster"
              );


            posterImage.classList
              .remove(
                "visible"
              );


            setTimeout(

              function() {

                posterImage.src
                  =
                  poster;

                posterImage
                  .classList
                  .add(
                    "visible"
                  );

              },

              100

            );

          }

        );


      }

    );


  </script>
