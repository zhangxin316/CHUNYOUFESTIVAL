<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHUNYOU FESTIVAL</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">


  <style>

    /* =========================
       ENTRY SCREEN
    ========================= */

    .entry-screen {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;
      height: 100svh;

      background: #000;

      color: #fff;

      display: flex;

      align-items: center;
      justify-content: center;

      z-index: 9999;

      cursor: pointer;

      opacity: 1;

      transition: opacity 0.8s ease;

    }


    .entry-screen.hide {

      opacity: 0;

      pointer-events: none;

    }


    .entry-text {

      font-family: "Inter", Arial, sans-serif;

      font-size: clamp(28px, 4vw, 64px);

      font-weight: 400;

      letter-spacing: -0.02em;

      text-align: center;

    }


    @media (max-width: 800px) {

      .entry-text {

        font-size: 28px;

        padding: 0 20px;

      }

    }

  </style>

</head>



<body>


  <!-- 第一次进入网站时显示 -->

  <div class="entry-screen" id="entryScreen">

    <div class="entry-text">
      WE MEET IN SPRING.
    </div>

  </div>



  <!-- 原来的首页 -->

  <main class="hero">

    <img
      src="logo.png"
      alt="CHUNYOU Logo"
      class="logo"
    >


    <h1>
      CHUNYOU FESTIVAL
    </h1>


    <p class="since">
      EST. 2013
    </p>


    <nav class="menu">

      <a href="archive.html">
        Archive
      </a>

      <a href="festival.html">
        Festival
      </a>

      <a href="#">
        News
      </a>

      <a href="#">
        Family
      </a>

      <a href="#">
        Contact
      </a>

    </nav>

  </main>



  <script>

    const entryScreen =
      document.getElementById("entryScreen");


    entryScreen.addEventListener(
      "click",
      function() {

        entryScreen.classList.add("hide");


        setTimeout(function() {

          entryScreen.style.display = "none";

        }, 800);

      }
    );

  </script>


</body>

</html>
